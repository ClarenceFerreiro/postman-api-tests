name: Allure Report

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Newman & Allure
      run: |
        npm install -g newman newman-reporter-allure
        npm install -g allure-commandline

    - name: Clean cache and old results
      run: |
        rm -rf allure-results allure-report
        npm cache clean --force

    - name: Run API tests
      run: |
        newman run my-collection.json \
          -r cli,allure \
          --reporter-allure-export allure-results

    - name: Generate Allure Report
      run: |
        allure generate allure-results -o allure-report --clean

    - name: Add timestamp to force refresh
      run: |
        echo "Build time: $(date)" > allure-report/timestamp.txt

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report
        destination_dir: allure
        keep_files: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ Postman API Tests passed!
          📊 Allure report: https://clarenceferreiro.github.io/postman-api-tests/allure/
          🕒 ${{ github.event.head_commit.timestamp }}
