name: Integration Tests — Mock API (Docker)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mock-api-integration:
    name: 🐳 Mock API Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Docker Compose
      run: |
        docker-compose --version
        docker --version

    - name: Start Mock API + Run Tests
      run: |
        docker-compose up --build --abort-on-container-exit api-tests
      env:
        TEST_ENV: mock

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mock-integration-results
        path: api-tests-ts/reports/
