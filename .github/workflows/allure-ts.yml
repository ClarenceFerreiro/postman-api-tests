name: HTML Report — TypeScript Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  html-report:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd api-tests-ts
        npm install

    - name: Run tests with HTML reporter
      run: |
        cd api-tests-ts
        npm test

    - name: Prepare report for Pages
      run: |
        mkdir -p html-report-ts
        cp api-tests-ts/reports/test-report.html html-report-ts/index.html
        echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>TypeScript Test Report</title></head><body><h1>TypeScript API Test Report</h1><p><a href='index.html'>View Full Report</a></p><p>Generated: $(date -u)</p></body></html>" > html-report-ts/landing.html

    - name: Deploy to GitHub Pages (subfolder)
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: html-report-ts
        destination_dir: allure-ts
        keep_files: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ TypeScript Test Report updated!
          📊 https://clarenceferreiro.github.io/postman-api-tests/allure-ts/
