name: TypeScript API Tests v2

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smoke-tests:
    name: 🔥 Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd api-tests-ts && npm install

      - name: Run Smoke Tests
        run: cd api-tests-ts && npm run test:smoke

      - name: Smoke Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: api-tests-ts/reports/

  regression-tests:
    name: 📋 Regression Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd api-tests-ts && npm install

      - name: Run Full Regression Suite
        run: cd api-tests-ts && npm run test:regression

      - name: Generate Coverage Report
        run: cd api-tests-ts && npm run test:coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api-tests-ts/coverage/

  negative-tests:
    name: 🧪 Negative Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd api-tests-ts && npm install

      - name: Run Negative Tests
        run: cd api-tests-ts && npm run test:negative

  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd api-tests-ts && npm install

      - name: Run Performance Tests
        run: cd api-tests-ts && npm run test:performance

      - name: Performance Report
        run: |
          echo "::notice::Performance tests completed. Check logs for duration metrics."

  full-suite:
    name: ✅ Full Suite + Junit Report
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, negative-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd api-tests-ts && npm install

      - name: Run Full Suite with Junit
        run: cd api-tests-ts && npm run test:ci

      - name: Upload Junit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: api-tests-ts/reports/junit-report.xml
