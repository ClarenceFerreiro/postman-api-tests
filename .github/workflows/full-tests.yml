name: Full Test Suite

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Postman tests
        run: |
          npm install -g newman newman-reporter-allure
          newman run my-collection.json -r allure --reporter-allure-export newman-results
      - name: Deploy Newman Allure
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./newman-results
          destination_dir: allure-newman
          keep_files: true

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run TypeScript tests
        run: |
          cd api-tests-ts
          npm ci
          npm test -- --allure
      - name: Deploy TS Allure
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./api-tests-ts/allure-results
          destination_dir: allure-ts
          keep_files: true

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Playwright tests
        run: |
          cd api-tests-ts
          npm ci
          npx playwright install --with-deps
          npx playwright test
      - name: Deploy Playwright report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./api-tests-ts/playwright-report
          destination_dir: playwright
          keep_files: true
