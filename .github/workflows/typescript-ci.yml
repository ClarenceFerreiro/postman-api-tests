name: TypeScript API Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  typescript-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd api-tests-ts
          npm install

      - name: Run TypeScript tests
        run: |
          cd api-tests-ts
          npm test

      - name: Install Allure Commandline
        run: |
          npm install -g allure-commandline

      - name: Create Allure results directory
        run: |
          mkdir -p api-tests-ts/allure-results

      - name: Generate Allure Report from test output
        run: |
          cd api-tests-ts
          allure generate allure-results -o allure-report --clean || echo "No results yet, creating empty report"
          echo "{}" > allure-results/environment.json

      - name: Deploy TypeScript Allure Report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          publish_branch: gh-pages
          publish_dir: api-tests-ts/allure-report
          destination_dir: allure-ts
          keep_files: true
