name: TypeScript API Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  typescript-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd api-tests-ts
          npm install
          npm install --save-dev allure-jest

      - name: Run TypeScript tests with Allure
        run: |
          cd api-tests-ts
          npm test

      - name: Generate Allure Report
        run: |
          cd api-tests-ts
          npx allure-commandline generate allure-results -o allure-report --clean || true

      - name: Deploy TypeScript Allure Report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          publish_branch: gh-pages
          publish_dir: api-tests-ts/allure-report
          destination_dir: allure-ts
          keep_files: true
