name: TypeScript API Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  typescript-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd api-tests-ts
          npm ci

      - name: Run TypeScript tests
        run: |
          cd api-tests-ts
          npm test
