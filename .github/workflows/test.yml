name: API Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Newman
        run: npm install -g newman
      
      - name: Run API tests
        run: newman run simple-test.json
      
      - name: Generate HTML report
        run: newman run simple-test.json --reporters cli,html --reporter-html-export report.html
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html
