name: API Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Newman
        run: npm install -g newman
      
      - name: Run API tests
        id: api_tests
        continue-on-error: true
        run: newman run simple-test.json
      
      - name: Send ntfy notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            EMOJI="✅"
            STATUS="PASSED"
          else
            EMOJI="❌"
            STATUS="FAILED"
          fi
          curl -H "Title: API Tests $STATUS" \
               -H "Priority: default" \
               -H "Tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }}" \
               -d "$EMOJI API Tests $STATUS%0A📦 ${{ github.repository }}%0A📝 ${{ github.event.head_commit.message }}%0A👤 ${{ github.actor }}%0A🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               https://ntfy.sh/clarence_qa_tests
