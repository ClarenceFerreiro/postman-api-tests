name: API Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Newman
        run: npm install -g newman
      
      - name: Run API tests
        id: api_tests
        continue-on-error: true
        run: newman run simple-test.json
      
      - name: Send Telegram notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            EMOJI="✅"
            STATUS="PASSED"
          else
            EMOJI="❌"
            STATUS="FAILED"
          fi
          MESSAGE="$EMOJI API Tests $STATUS%0A"
          MESSAGE="$MESSAGE 📦 Repo: ${{ github.repository }}%0A"
          MESSAGE="$MESSAGE 📝 Commit: ${{ github.event.head_commit.message }}%0A"
          MESSAGE="$MESSAGE 👤 Author: ${{ github.actor }}%0A"
          MESSAGE="$MESSAGE 🌿 Branch: ${{ github.ref_name }}%0A"
          MESSAGE="$MESSAGE 🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE"
