version: "3.8"

services:
  mock-api:
    image: clue/json-server
    container_name: json-server-mock
    ports:
      - "3000:80"
    volumes:
      - ./mock-api:/data
    environment:
      - JSON_SERVER_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/posts"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-tests:
    image: node:20-alpine
    container_name: api-tests-ts
    working_dir: /app
    volumes:
      - ./api-tests-ts:/app
    environment:
      - BASE_URL=http://mock-api:80
    depends_on:
      mock-api:
        condition: service_healthy
    command: ["sh", "-c", "npm install && npm run test:allure"]

  k6-load-tests:
    image: grafana/k6:latest
    container_name: k6-load
    volumes:
      - ./k6:/k6
    environment:
      - API_BASE_URL=http://mock-api:80
    depends_on:
      mock-api:
        condition: service_healthy
    command: ["run", "/k6/load-test.js"]
