version: '3.8'

services:
  mock-api:
    image: node:20-alpine
    container_name: mock-api
    ports:
      - "3000:80"
    volumes:
      - ./mock-api:/app/mock
    working_dir: /app
    command: >
      sh -c "npm install -g json-server@0.17.4 &&
             json-server --watch /app/mock/db.json
             --port 80 --host 0.0.0.0
             --middlewares /app/mock/middleware.js
             --routes /app/mock/routes.json"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/posts/1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - test-network

  api-tests:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./api-tests-ts:/app
    environment:
      - BASE_URL=http://mock-api:80
      - TEST_ENV=mock
    command: >
      sh -c "npm install && TEST_ENV=mock npx jest --testNamePattern='Mock-Specific'"
    depends_on:
      mock-api:
        condition: service_healthy
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
