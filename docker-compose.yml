version: '3.8'

services:
  mock-api:
    image: node:20-alpine
    container_name: mock-api
    ports:
      - "3000:3000"
    volumes:
      - ./mock-api:/app/mock
    working_dir: /app/mock
    command: node server.js
    environment:
      - PORT=3000
      - DATA_FILE=./db.json
    networks:
      - test-network

  api-tests:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./api-tests-ts:/app
    environment:
      - BASE_URL=http://mock-api:3000
      - TEST_ENV=mock
    command: >
      sh -c "npm install &&
             for i in {1..20}; do
               wget -qO- http://mock-api:3000/posts/1 >/dev/null 2>&1 && break;
               echo \"Waiting for mock-api... attempt $$i\";
               sleep 3;
             done &&
             TEST_ENV=mock npx jest --testNamePattern='Mock-Specific'"
    depends_on:
      - mock-api
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
